# ~/.tmux.conf — fzf-powered navigation

# set Zsh as your default Tmux shell
set-option -g default-shell /bin/zsh

# change tmux leader combo
set -g prefix C-a
unbind %

# use pipes to open splits
bind \\ split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# resize Panes with Prefix-arrow keys
unbind Right
bind Right resize-pane -R 8
unbind Left
bind Left resize-pane -L 8
unbind Down
bind Down resize-pane -D 4
unbind Up
bind Up resize-pane -U 4

# vim-tmux-navigator (christoomey) — seamless Ctrl-h/j/k/l between vim & tmux
# panes. These bindings detect whether the active pane is running vim and
# forward the key if so; otherwise they switch tmux panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# prefix + f : fuzzy-switch to any window across all sessions, in a popup
bind-key f display-popup -E -w 80% -h 60% "\
    tmux list-windows -a -F '#S:#I #W' \
    | fzf --reverse --prompt='window> ' \
    | awk '{print \$1}' \
    | xargs -r tmux switch-client -t"

# prefix + s : fuzzy-switch sessions in a popup (overrides default session list)
bind-key s display-popup -E -w 60% -h 50% "\
    tmux list-sessions -F '#S' \
    | fzf --reverse --prompt='session> ' \
    | xargs -r tmux switch-client -t"

# quality-of-life defaults that pair well with the above
set -g base-index 1          # windows start at 1, matches the popup list
setw -g pane-base-index 1
set -g mouse on              # scroll/select in popups and panes
set -g history-limit 50000
set -sg escape-time 10       # snappier vim mode-switch inside tmux

# renumber windows when closing them
set -g renumber-windows on

# make vim shift bindings work
set-window-option -g xterm-keys on

# switch to last pane
bind-key C-a last-pane

# use vim keybindings in copy mode
setw -g mode-keys vi

# setup 'v' to begin selection as in Vim, 'y'/Enter to copy to the macOS clipboard.
# tmux 3.x on macOS talks to pbcopy/pbpaste directly (no reattach-to-user-namespace).
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# bind ']' to use pbpaste
bind ] run "pbpaste | tmux load-buffer - && tmux paste-buffer"

# don't automatically rename windows
set-option -g allow-rename off

# c will create new window in next position and in current working directory
bind-key c new-window -a -c '#{pane_current_path}'

# C to create window in last position and in current working directory
bind-key C new-window -c '#{pane_current_path}'

# leader P to move window left
bind-key P swap-window -t -1

# leader N to move window right
bind-key N swap-window -t +1

# increment number setup (C-a C-a)
bind C-a send-prefix

# reload config file
bind r source-file ~/.tmux.conf \; display-message "config reloaded"

######################
### DESIGN CHANGES ###
######################

# correct colors
set -g default-terminal "screen-256color"

# panes blue
set -g pane-border-style fg=colour238,bg=colour236
set -g pane-active-border-style fg=colour51,bg=colour236

## status bar design
set -g status-justify left
set -g status-interval 2
set -g status-position bottom
set -g status-style fg=colour137,bg=default,dim
set -g status-left ''
set -g status-left-length 20
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50

# messaging
set -g message-style fg=colour232,bg=colour166,bold
set -g message-command-style fg=blue,bg=black

# window mode / copy mode
setw -g mode-style fg=colour196,bg=colour238,bold

# current window in the status bar
setw -g window-status-current-style fg=colour81,bg=colour236,bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

# other windows in the status bar
setw -g window-status-style fg=colour138,bg=colour235,none
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# window with a bell
setw -g window-status-bell-style fg=colour255,bg=colour1,bold

# notify visually when background windows produce output
set-window-option -g monitor-activity on
set-option -g visual-activity on
set-option -g visual-bell off
set-option -g visual-silence off
set-option -g bell-action none

# clock mode
setw -g clock-mode-colour colour135

# claude-tmux
bind-key C-c display-popup -E -w 80 -h 30 "~/.cargo/bin/claude-tmux"

